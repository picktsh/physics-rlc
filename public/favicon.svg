<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- logo · 白底瓷砖 + 小字 RLC + 高斯谐振峰(顶点节点):主色用蓝色,与浅色主题同源的学术藏青/亮蓝 -->
  <defs>
    <linearGradient id="l7-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" />
      <stop offset="1" stop-color="#e8f0fe" />
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="15" fill="url(#l7-bg)" />
  <!-- 小字字标 -->
  <text x="32" y="25" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="800" letter-spacing="-0.5" fill="#1f4e79">RLC</text>
  <!-- 频率基线 -->
  <path d="M12 51 H52" stroke="#2563eb" stroke-opacity="0.32" stroke-width="2.2" stroke-linecap="round" />
  <!-- 高斯谐振峰 -->
  <path d="M12 51 C23 51 27 36 32 36 C37 36 41 51 52 51" fill="none" stroke="#2563eb" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" />
  <!-- 顶点节点 -->
  <circle cx="32" cy="36" r="3.4" fill="#ffffff" stroke="#1f4e79" stroke-width="2" />
</svg>
