<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RLC 数字仿真平台</title>
    <script>
      /* 首屏防闪烁:在 CSS/JS 加载前按 localStorage 持久化偏好预设主题属性 */
      try {
        var t = localStorage.getItem('app-theme')
        if (t === 'light' || t === 'dark' || t === 'macaron' || t === 'green') {
          document.documentElement.setAttribute('data-theme', t)
        }
      } catch (e) {}
    </script>
    <style>
      /* 首屏加载动画:打包体积较大,JS 加载/执行期间先用纯 CSS 缺口圆环过渡;
         Vue 挂载时会清空 #app 内容,loading 随之自动移除,无需额外 JS */
      #app-loading {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        background-color: #f3f5f9;
      }
      /* loading 背景/圆环同步四套配色:此处的字面色值系 styles/theme.css 中 --app-bg / --app-brand /
         --app-border 等 token 在各主题下的取值(内联必须在 CSS 加载前生效,属“故意重复”);
         ⚠ 改动 theme.css 对应 token 取值时,必须同步修改此处 */
      html[data-theme='dark'] #app-loading {
        background-color: #0d1322;
      }
      html[data-theme='macaron'] #app-loading {
        background-color: #fdf9ec;
      }
      html[data-theme='green'] #app-loading {
        background-color: #eef6f1;
      }
      #app-loading .loading-spinner {
        width: 44px;
        height: 44px;
        border: 4px solid #e2e7f0;
        border-top-color: #2563eb;
        border-radius: 50%;
        animation: app-loading-spin 0.8s linear infinite;
      }
      html[data-theme='dark'] #app-loading .loading-spinner {
        border-color: #27324c;
        border-top-color: #5b8ef7;
      }
      html[data-theme='macaron'] #app-loading .loading-spinner {
        border-color: #f0e6c6;
        border-top-color: #b8860b;
      }
      html[data-theme='green'] #app-loading .loading-spinner {
        border-color: #d5e8dd;
        border-top-color: #42b883;
      }
      #app-loading .loading-text {
        font-size: 13px;
        letter-spacing: 0.08em;
        color: #8a97ab;
      }
      @keyframes app-loading-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="app-loading">
        <div class="loading-spinner"></div>
        <div class="loading-text">加载中…</div>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
